<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Neon Skies</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #050817; font-family: Inter, system-ui, sans-serif; }
		.wrap { position: relative; width: min(94vw, 520px); aspect-ratio: 9 / 16; max-height: 94vh; border: 1px solid #3b83ff88; border-radius: 24px; overflow: hidden; box-shadow: 0 0 50px #1665ff44, inset 0 0 30px #ffffff0b; }
		canvas { display: block; width: 100%; height: 100%; }
		.hud { position: absolute; inset: 0; pointer-events: none; padding: 24px; display: flex; justify-content: space-between; align-items: flex-start; text-transform: uppercase; letter-spacing: .14em; }
		.brand { color: #a9caff; font-size: 11px; font-weight: 800; text-shadow: 0 0 12px #55aaff; }
		.score { color: white; font-size: 29px; font-weight: 900; text-shadow: 0 0 15px #48d9ff; }
		.panel { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
		.card { text-align: center; padding: 28px 34px; border: 1px solid #8ad8ff66; border-radius: 20px; background: #08132dcc; box-shadow: 0 0 35px #22aaff33, inset 0 0 30px #ffffff08; backdrop-filter: blur(8px); }
		h1 { margin: 0 0 8px; color: #fff; font-size: clamp(27px, 7vw, 42px); letter-spacing: .12em; text-shadow: 0 0 18px #35caff; }
		p { margin: 8px 0; color: #b6d9ee; font-size: 12px; letter-spacing: .12em; }
		.hint { color: #65eaff; font-weight: 700; }
		.choices { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
		button { cursor: pointer; padding: 11px 12px; border: 1px solid #65eaff99; border-radius: 10px; color: #dffaff; background: #173b72; font: 800 11px inherit; letter-spacing: .08em; }
		.hidden { display: none; }
	</style>
</head>
<body>
	<main class="wrap">
		<canvas id="game"></canvas>
		<div class="hud"><span class="brand">NEON / SKIES</span><span class="score" id="score">0</span></div>
		<div class="panel" id="panel"><div class="card"><h1>NEON ARCADE</h1><p>CHOOSE YOUR RIDE</p><div class="choices"><button data-game="skies">NEON SKIES</button><button data-game="streets">NEON STREETS</button></div></div></div>
	</main>
	<script>
		const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
		const scoreEl = document.querySelector('#score'), panel = document.querySelector('#panel');
		let W, H, dpr, bird, pipes, particles, score, state = 'ready', last = 0, spawn = 0, mode = 'skies', car, cars = [], roadOffset = 0;
		const resize = () => { dpr = devicePixelRatio; const r = canvas.getBoundingClientRect(); W = r.width; H = r.height; canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
		addEventListener('resize', resize); resize();
		const reset = (show=true) => { bird = { x: W*.28, y: H*.46, vy: 0, r: 13, rot: 0 }; car={x:W/2,y:H*.82,w:30,h:50,vx:0}; pipes=[]; cars=[]; particles=[]; score=0; spawn=0; roadOffset=0; scoreEl.textContent=0; state='ready'; if(show) panel.classList.remove('hidden'); };
		panel.addEventListener('click', e => { if (!e.target.dataset.game) return; mode=e.target.dataset.game; reset(false); state='play'; panel.classList.add('hidden'); });
		const flap = () => { if (state === 'over') reset(); if (state === 'ready') { state='play'; panel.classList.add('hidden'); } bird.vy = -H*.0068; burst(bird.x-12,bird.y+5,'#67eaff',5); };
		addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } }); canvas.addEventListener('pointerdown', flap);
		const keys = { left:false, right:false }; addEventListener('keydown', e => { if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true; if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true; }); addEventListener('keyup', e => { if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false; if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false; });
		function burst(x,y,color,n=8) { for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:1,color}); }
		function addPipe() { const gap=H*.22, top=H*.13+Math.random()*(H*.48); pipes.push({x:W+35, top, bottom:top+gap, passed:false}); }
		function end() { state='over'; panel.innerHTML='<div class="card"><h1>FLIGHT ENDED</h1><p>SCORE &nbsp; '+score+'</p><p class="hint">CLICK OR PRESS SPACE TO RETRY</p></div>'; panel.classList.remove('hidden'); burst(bird.x,bird.y,'#ff5ea8',22); }
		function drawBackground(t) { const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#081432'); g.addColorStop(.55,'#10235a'); g.addColorStop(1,'#170e35'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); for(let i=0;i<45;i++){const x=(i*83+(t*.012*(i%3+1)))%W,y=(i*47)%H,s=1+(i%3);ctx.fillStyle='#8eeaffaa';ctx.fillRect(x,y,s,s);} ctx.strokeStyle='#31b9ff16'; ctx.lineWidth=1; for(let y=H*.72;y<H;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} }
		function drawPipe(p) { const grad=ctx.createLinearGradient(p.x,0,p.x+34,0); grad.addColorStop(0,'#164cff');grad.addColorStop(.5,'#49eaff');grad.addColorStop(1,'#7157ff'); ctx.shadowBlur=18;ctx.shadowColor='#28baff';ctx.fillStyle=grad; ctx.fillRect(p.x,0,34,p.top-12);ctx.fillRect(p.x,p.bottom+12,34,H);ctx.fillStyle='#a6f5ff';ctx.fillRect(p.x-5,p.top-12,44,12);ctx.fillRect(p.x-5,p.bottom,44,12);ctx.shadowBlur=0; }
		function drawBird() { ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.shadowBlur=22;ctx.shadowColor='#3cecff';let g=ctx.createRadialGradient(-4,-5,2,0,0,18);g.addColorStop(0,'#fff');g.addColorStop(.35,'#6df6ff');g.addColorStop(1,'#615bff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-5,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111b4a';ctx.beginPath();ctx.arc(8,-5,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7acb';ctx.beginPath();ctx.moveTo(12,1);ctx.lineTo(22,5);ctx.lineTo(12,8);ctx.fill();ctx.restore(); }
		function drawStreets() { ctx.fillStyle='#07101d';ctx.fillRect(0,0,W,H);ctx.fillStyle='#18233c';ctx.fillRect(W*.16,0,W*.68,H);ctx.strokeStyle='#65eaff88';ctx.lineWidth=3;ctx.setLineDash([25,25]);ctx.lineDashOffset=-roadOffset;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]); }
		function drawCar(x,y,color='#ff3fbb') { ctx.shadowBlur=18;ctx.shadowColor=color;ctx.fillStyle=color;ctx.fillRect(x-15,y-25,30,50);ctx.fillStyle='#8cf7ff';ctx.fillRect(x-9,y-15,18,12);ctx.shadowBlur=0; }
		function loop(t) { const dt=Math.min((t-last)/16.67,2);last=t; if(mode==='streets'){drawStreets();if(state==='play'){if(keys.left)car.vx-=.4*dt;if(keys.right)car.vx+=.4*dt;car.vx*=.88;car.x=Math.max(W*.2,Math.min(W*.8,car.x+car.vx*dt));roadOffset+=5*dt;spawn+=dt;if(spawn>55){spawn=0;cars.push({x:W*.22+Math.random()*W*.56,y:-30});}cars.forEach(o=>{o.y+=5*dt;if(Math.abs(o.x-car.x)<28&&Math.abs(o.y-car.y)<50)end();if(o.y>H){score++;scoreEl.textContent=score;}});cars=cars.filter(o=>o.y<H+60);}cars.forEach(o=>drawCar(o.x,o.y,'#65eaff'));drawCar(car.x,car.y);}else{drawBackground(t);if(state==='play'){bird.vy+=.34*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.45,Math.min(1.15,bird.vy*.06));spawn+=dt;if(spawn>105){spawn=0;addPipe();}pipes.forEach(p=>{p.x-=2.7*dt;if(!p.passed&&p.x+34<bird.x){p.passed=true;score++;scoreEl.textContent=score;}});pipes=pipes.filter(p=>p.x>-55);if(bird.y-bird.r<0||bird.y+bird.r>H||pipes.some(p=>bird.x+bird.r>p.x&&bird.x-bird.r<p.x+34&&(bird.y-bird.r<p.top||bird.y+bird.r>p.bottom)))end();}pipes.forEach(drawPipe);drawBird();}particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.life-=.035;ctx.globalAlpha=q.life;ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,3,3);});particles=particles.filter(q=>q.life>0);ctx.globalAlpha=1;requestAnimationFrame(loop); }
		reset(); requestAnimationFrame(loop);
	</script>
</body>
</html>
